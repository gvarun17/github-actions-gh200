# Organization workflow template.
# Location: <org>/.github repo -> workflow-templates/python-ci.yml
# $default-branch is replaced with the repo's default branch on creation.
name: Python CI (Platform)

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

permissions:
  contents: read

jobs:
  ci:
    uses: my-org/ci-workflows/.github/workflows/python-ci.yml@v3
    with:
      python-version: '3.13'
    secrets: inherit
