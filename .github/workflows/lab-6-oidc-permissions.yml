name: Lab 6 - Permissions and OIDC Token

on:
  workflow_dispatch:

# Declaring any permission zeroes the rest. Inspect what happens below.
permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Request an OIDC token and show its claims (no cloud needed)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool | grep -E '"(iss|sub|aud|repository|ref|workflow)"'
      - name: Try something the token isn't allowed to do
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title x --body y
